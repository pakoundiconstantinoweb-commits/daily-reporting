<main class="admin-page">
  <section class="admin-card" aria-labelledby="admin-title">
    <p class="admin-eyebrow">Espace Manager</p>
    <h1 id="admin-title">Créer le Directeur / Manager</h1>
    <p class="admin-description">Créez votre compte Manager avec l’invitation qui vous a été transmise.</p>

    @if (invitationToken()) {
    <form (ngSubmit)="createManager()">
      <div class="form-grid">
        <div><label for="first-name">Prénom</label><input id="first-name" name="firstName" autocomplete="given-name" required maxlength="80" [ngModel]="firstName()" (ngModelChange)="firstName.set($event)"></div>
        <div><label for="last-name">Nom</label><input id="last-name" name="lastName" autocomplete="family-name" required maxlength="80" [ngModel]="lastName()" (ngModelChange)="lastName.set($event)"></div>
        <div class="wide"><label for="email">Email professionnel</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="160" [ngModel]="email()" (ngModelChange)="email.set($event)"></div>
        <div class="wide"><label for="phone">Téléphone <span>(facultatif)</span></label><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="30" [ngModel]="phone()" (ngModelChange)="phone.set($event)"></div>
        <div class="wide"><label for="password">Mot de passe</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="120" [ngModel]="password()" (ngModelChange)="password.set($event)"><small>8 caractères minimum.</small></div>
        <div class="wide"><label for="confirm-password">Confirmer le mot de passe</label><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="120" [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)"></div>
      </div>

      @if (error()) { <p class="form-message error" role="alert">{{ error() }}</p> }
      @if (success()) { <p class="form-message success" role="status">{{ success() }}</p> }
      <button type="submit" [disabled]="loading()">{{ loading() ? 'Création en cours…' : 'Créer le compte Manager' }}</button>
    </form>
    } @else if (error()) { <p class="form-message error" role="alert">{{ error() }}</p> }
  </section>
</main>
