<section class="login-screen" aria-labelledby="login-title">
  <div class="login-card">
    <div class="login-heading">
      <h1 id="login-title">Connexion</h1>
      <p class="muted">Accédez à votre espace de reporting.</p>
    </div>
    <form (ngSubmit)="login()">
      <label for="email">Email professionnel</label>
      <input id="email" name="email" type="email" autocomplete="email" required [ngModel]="email()" (ngModelChange)="email.set($event)" placeholder="email@gmail.com">
      <label for="password">Mot de passe</label>
      <div class="password-field"><input id="password" name="password" type="password" [attr.type]="passwordVisible() ? 'text' : 'password'" autocomplete="current-password" required [ngModel]="password()" (ngModelChange)="password.set($event)" placeholder="Saisissez votre mot de passe">@if (password()) { <button type="button" class="password-toggle" (click)="togglePassword()" [attr.aria-label]="passwordVisible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"><span class="eye-icon" aria-hidden="true"></span><span class="visually-hidden">{{ passwordVisible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe' }}</span></button> }</div>
      @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
      <button class="primary-button" type="submit" [disabled]="loading()">{{ loading() ? 'Connexion...' : 'Se connecter' }}</button>
    </form>
    <p class="login-footnote">Daily Reporting</p>
  </div>
</section>
